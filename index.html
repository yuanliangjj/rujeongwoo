<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Simulator</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e8e8ed;
    font-family: -apple-system, BlinkMacSystemFont,
                 "Helvetica Neue", sans-serif;
}

/* BINGKAI IPHONE */
.iphone {
    width: 320px;
    height: 660px;
    border: 9px solid #222;
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    background: #111;
    box-shadow: 0 20px 50px #0003;
}

/* WALLPAPER */
.screen {
    width: 100%;
    height: 100%;
    position: relative;
    background:
        radial-gradient(ellipse at 20% 25%,
            #ffd7e7 0%, transparent 45%),
        radial-gradient(ellipse at 80% 70%,
            #9db9ff 0%, transparent 50%),
        linear-gradient(145deg,
            #c6d9ff, #d8c6f4, #f7cfe0);
    color: white;
}

/* DYNAMIC ISLAND */
.island {
    position: absolute;
    width: 95px;
    height: 25px;
    background: black;
    border-radius: 20px;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
}

/* STATUS BAR */
.status {
    position: absolute;
    top: 13px;
    left: 22px;
    right: 22px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 600;
    z-index: 11;
}

/* LOCK SCREEN */
#lockScreen {
    height: 100%;
    text-align: center;
    padding-top: 65px;
}

.date {
    font-size: 15px;
    margin-bottom: 5px;
}

.big-time {
    font-size: 66px;
    font-weight: 300;
    letter-spacing: -3px;
}

.enter-text {
    margin-top: 38px;
    font-size: 17px;
    font-weight: 500;
}

.dots {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin: 22px 0;
}

.dot {
    width: 12px;
    height: 12px;
    border: 1.5px solid white;
    border-radius: 50%;
}

.dot.filled {
    background: white;
}

.error {
    height: 18px;
    font-size: 12px;
    color: #fff;
}

/* KEYPAD */
.keypad {
    width: 225px;
    margin: 14px auto 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.key {
    width: 63px;
    height: 63px;
    border-radius: 50%;
    border: none;
    background: #ffffff42;
    color: white;
    font-size: 27px;
    font-weight: 400;
    cursor: pointer;
    transition: background .15s;
}

.key:active {
    background: #ffffff85;
}

.key small {
    display: block;
    font-size: 8px;
    letter-spacing: 1px;
}

.bottom-actions {
    display: flex;
    justify-content: space-between;
    padding: 20px 35px;
    font-size: 12px;
}

/* HOMESCREEN */
#homeScreen {
    display: none;
    height: 100%;
    padding: 65px 18px 30px;
}

.widgets {
    height: 125px;
    padding: 15px;
    border-radius: 20px;
    background: #ffffff35;
    margin-bottom: 25px;
    backdrop-filter: blur(10px);
}

.widget-title {
    font-size: 12px;
}

.widget-time {
    font-size: 35px;
    font-weight: 300;
    margin-top: 5px;
}

.apps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px 9px;
}

.app {
    text-align: center;
    font-size: 10px;
    text-shadow: 0 1px 3px #5558;
}

.app-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 5px;
    border-radius: 13px;
    background: #ffffffcc;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 25px;
    text-shadow: none;
}

.dock {
    position: absolute;
    bottom: 25px;
    left: 15px;
    right: 15px;
    height: 75px;
    background: #ffffff50;
    border-radius: 25px;
    display: flex;
    justify-content: space-evenly;
    align-items: center;
    backdrop-filter: blur(12px);
}

.dock .app-icon {
    margin: 0;
}

.home-indicator {
    position: absolute;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 4px;
    border-radius: 10px;
    background: white;
    z-index: 20;
    cursor: pointer;
}

/* TOMBOL KUNCI */
.lock-button {
    position: absolute;
    right: 12px;
    top: 14px;
    z-index: 30;
    border: none;
    background: transparent;
    color: white;
    font-size: 12px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="iphone">
    <div class="screen">

        <div class="island"></div>

        <div class="status">
            <span>9:41</span>
            <span>● ▰ ▰</span>
        </div>

        <!-- LOCK SCREEN -->
        <div id="lockScreen">

            <div class="date" id="dateText">
                Monday, October 19
            </div>

            <div class="big-time" id="clock">
                9:41
            </div>

            <div class="enter-text">
                Enter Passcode
            </div>

            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="error" id="error"></div>

            <div class="keypad">
                <button class="key" onclick="press(1)">1</button>
                <button class="key" onclick="press(2)">2</button>
                <button class="key" onclick="press(3)">3</button>

                <button class="key" onclick="press(4)">4</button>
                <button class="key" onclick="press(5)">5</button>
                <button class="key" onclick="press(6)">6</button>

                <button class="key" onclick="press(7)">7</button>
                <button class="key" onclick="press(8)">8</button>
                <button class="key" onclick="press(9)">9</button>

                <div></div>
                <button class="key" onclick="press(0)">0</button>
                <button class="key" onclick="backspace()"
                    style="background:transparent;font-size:14px">
                    Delete
                </button>
            </div>

            <div class="bottom-actions">
                <span>Emergency</span>
                <span>Cancel</span>
            </div>
        </div>

        <!-- HOMESCREEN -->
        <div id="homeScreen">

            <button class="lock-button" onclick="lockPhone()">
                🔒 Lock
            </button>

            <div class="widgets">
                <div class="widget-title" id="homeDate">
                    Monday, October 19
                </div>
                <div class="widget-time" id="homeClock">
                    9:41
                </div>
                <div style="font-size:11px">
                    Have a lovely day ✨
                </div>
            </div>

            <div class="apps">

                <div class="app">
                    <div class="app-icon">📷</div>
                    Photos
                </div>

                <div class="app">
                    <div class="app-icon">📅</div>
                    Calendar
                </div>

                <div class="app">
                    <div class="app-icon">🎵</div>
                    Music
                </div>

                <div class="app">
                    <div class="app-icon">⚙️</div>
                    Settings
                </div>

                <div class="app">
                    <div class="app-icon">📝</div>
                    Notes
                </div>

                <div class="app">
                    <div class="app-icon">💬</div>
                    Messages
                </div>

                <div class="app">
                    <div class="app-icon">🗓️</div>
                    Reminders
                </div>

                <div class="app">
                    <div class="app-icon">🌤️</div>
                    Weather
                </div>

            </div>

            <div class="dock">
                <div class="app-icon">📞</div>
                <div class="app-icon">🌐</div>
                <div class="app-icon">✉️</div>
                <div class="app-icon">🎧</div>
            </div>
        </div>

        <div class="home-indicator" onclick="lockPhone()"></div>

    </div>
</div>

<script>
/* UBAH PASSCODE DI SINI */
const correctPasscode = "123456";

let enteredCode = "";

function press(number) {
    if (enteredCode.length >= 6) return;

    enteredCode += number;
    updateDots();

    if (enteredCode.length === 6) {
        setTimeout(checkPasscode, 250);
    }
}

function backspace() {
    enteredCode = enteredCode.slice(0, -1);
    document.getElementById("error").textContent = "";
    updateDots();
}

function updateDots() {
    const dots = document.querySelectorAll(".dot");

    dots.forEach((dot, index) => {
        dot.classList.toggle(
            "filled",
            index < enteredCode.length
        );
    });
}

function checkPasscode() {
    if (enteredCode === correctPasscode) {
        document.getElementById("lockScreen").style.display = "none";
        document.getElementById("homeScreen").style.display = "block";
        document.getElementById("error").textContent = "";
    } else {
        document.getElementById("error").textContent =
            "Incorrect Passcode";

        setTimeout(() => {
            enteredCode = "";
            updateDots();
            document.getElementById("error").textContent = "";
        }, 900);
    }
}

function lockPhone() {
    enteredCode = "";
    updateDots();

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("lockScreen").style.display = "block";
}

function updateClock() {
    const now = new Date();

    const time = now.toLocaleTimeString("en-US", {
        hour: "numeric",
        minute: "2-digit",
        hour12: false
    });

    const date = now.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric"
    });

    document.getElementById("clock").textContent = time;
    document.getElementById("homeClock").textContent = time;
    document.getElementById("dateText").textContent = date;
    document.getElementById("homeDate").textContent = date;
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
